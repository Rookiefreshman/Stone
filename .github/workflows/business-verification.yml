name: Stone business verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: stone_ci
          MYSQL_USER: stone_ci
          MYSQL_PASSWORD: ci_stone_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Apply V1-V5 to disposable database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          for version in 1 2 3 4 5; do
            files=(src/main/resources/db/migration/V"${version}"__*.sql)
            test "${#files[@]}" -eq 1
            test -f "${files[0]}"
            echo "Applying ${files[0]}"
            docker exec -i -e MYSQL_PWD=ci_stone_only "$MYSQL_CONTAINER" mysql -ustone_ci stone_ci < "${files[0]}"
          done
          docker exec -e MYSQL_PWD=ci_stone_only "$MYSQL_CONTAINER" mysql -ustone_ci stone_ci -e "SELECT VERSION(); SHOW TABLES;"
      - name: Java unit and MySQL integration verification
        env:
          STONE_TEST_MYSQL_URL: 'jdbc:mysql://127.0.0.1:3306/stone_ci?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          STONE_TEST_MYSQL_USER: stone_ci
          STONE_TEST_MYSQL_PASSWORD: ci_stone_only
        run: mvn -B -ntp clean verify
      - name: Require all business integration suites to execute
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = pathlib.Path("target/surefire-reports")
          required = {"DispatchMySqlTest", "DispatchDiagnosticMySqlTest", "OutboundDiagnosticMySqlTest", "CancelReceiptMySqlTest", "CancelOperationServiceTest"}
          found = set()
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in reports.glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              name = root.attrib["name"].split(".")[-1]
              counts = {k: int(root.attrib.get(k, "0")) for k in totals}
              for k, n in counts.items(): totals[k] += n
              print(name, counts)
              if name in required:
                  assert counts["tests"] > 0 and counts["skipped"] == 0, name
                  found.add(name)
          print("TOTAL", totals)
          assert found == required, f"Missing required suites: {required-found}"
          assert not totals["failures"] and not totals["errors"] and not totals["skipped"], totals
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-mysql-${{ matrix.mysql }}
          path: target/surefire-reports/
          if-no-files-found: warn
